        </table>
        <div className="mb-4">
          <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">OPERATING DATA RECORD</div>
          <div className="grid grid-cols-2 gap-2 text-xs text-neutral-300">
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">CHS Pressure</span><span>{record.chsPressure || "-"} PSI</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Supply Air Temp</span><span>{record.supplyAirTemp || "-"} C</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">CHR Pressure</span><span>{record.chrPressure || "-"} PSI</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Return Air Temp</span><span>{record.returnAirTemp || "-"} C</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">CHS Temperature</span><span>{record.chsTemp || "-"} F</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Air Delta T</span><span>{record.airDeltaT || "-"} C</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">CHR Temperature</span><span>{record.chrTemp || "-"} F</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Motor Current</span><span>{record.motorCurrent || "-"} A</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">CHW Delta T</span><span>{record.chwDeltaT || "-"} F</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Voltage</span><span>{record.voltage || "-"} V</span></div>
          </div>
        </div>
        {photos.length > 0 ? (
          <div className="mb-4">
            <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">รูปภาพประกอบ</div>
            <div className="grid grid-cols-3 gap-2">
              {photos.map(function (src, idx) {
                return <img key={idx} src={src} className="w-full aspect-square object-cover rounded border border-neutral-800" />;
              })}
            </div>
          </div>
        ) : null}
        <div className="pt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Chief Engineer</div>
          <div className="text-sm font-medium mb-2 text-amber-100">{record.chiefEngineerName || "-"}</div>
          {record.signature ? <img src={record.signature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Pool ---------- */
function PoolFormView(props) {
  const dateKey = props.dateKey;
  const entry = props.entry;
  const onSave = props.onSave;
  const onDateChange = props.onDateChange;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [ph8, setPh8] = useState(entry ? entry.ph8 : "");
  const [cl8, setCl8] = useState(entry ? entry.cl8 : "");
  const [p1_8, setP1_8] = useState(entry ? entry.p1_8 : "");
  const [p2_8, setP2_8] = useState(entry ? entry.p2_8 : "");
  const [ph19, setPh19] = useState(entry ? entry.ph19 : "");
  const [cl19, setCl19] = useState(entry ? entry.cl19 : "");
  const [p1_19, setP1_19] = useState(entry ? entry.p1_19 : "");
  const [p2_19, setP2_19] = useState(entry ? entry.p2_19 : "");
  const [clean1, setClean1] = useState(entry ? !!entry.clean1 : false);
  const [clean2, setClean2] = useState(entry ? !!entry.clean2 : false);
  const [remark, setRemark] = useState(entry ? entry.remark : "");
  const [checkedBy, setCheckedBy] = useState(entry ? entry.checkedBy : "");

  useEffect(function () {
    setPh8(entry ? entry.ph8 : ""); setCl8(entry ? entry.cl8 : "");
    setP1_8(entry ? entry.p1_8 : ""); setP2_8(entry ? entry.p2_8 : "");
    setPh19(entry ? entry.ph19 : ""); setCl19(entry ? entry.cl19 : "");
    setP1_19(entry ? entry.p1_19 : ""); setP2_19(entry ? entry.p2_19 : "");
    setClean1(entry ? !!entry.clean1 : false); setClean2(entry ? !!entry.clean2 : false);
    setRemark(entry ? entry.remark : ""); setCheckedBy(entry ? entry.checkedBy : "");
  }, [dateKey]);

  function handleSave() {
    onSave(dateKey, {
      ph8: ph8, cl8: cl8, p1_8: p1_8, p2_8: p2_8,
      ph19: ph19, cl19: cl19, p1_19: p1_19, p2_19: p2_19,
      clean1: clean1, clean2: clean2, remark: remark, checkedBy: checkedBy
    });
  }
  function handleDeleteClick() {
    if (window.confirm("ต้องการลบข้อมูลวันนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(dateKey);
    }
  }

  return (
    <div className="space-y-4 pb-6">
      <Section title="วันที่บันทึก (dd/mm/yyyy)">
        <DateField value={dateKey} onChange={onDateChange} />
      </Section>
      <Section title="รอบ 8:00 น.">
        <div className="grid grid-cols-2 gap-3">
          <Field label="PH" hint="มาตรฐาน 7.2 - 7.6">
            <input type="number" step="0.1" value={ph8} onChange={function (e) { setPh8(e.target.value); }} className={inputCls + (isOutOfRange(ph8, 7.2, 7.6) ? " border-red-500 ring-1 ring-red-500/40" : "")} />
          </Field>
          <Field label="CL (ppm)" hint="มาตรฐาน 1.5 - 3.0">
            <input type="number" step="0.1" value={cl8} onChange={function (e) { setCl8(e.target.value); }} className={inputCls + (isOutOfRange(cl8, 1.5, 3.0) ? " border-red-500 ring-1 ring-red-500/40" : "")} />
          </Field>
          <Field label="Pressure Filter 1 (PSI)"><input type="number" value={p1_8} onChange={function (e) { setP1_8(e.target.value); }} className={inputCls} /></Field>
          <Field label="Pressure Filter 2 (PSI)"><input type="number" value={p2_8} onChange={function (e) { setP2_8(e.target.value); }} className={inputCls} /></Field>
        </div>
      </Section>
      <Section title="รอบ 19:00 น.">
        <div className="grid grid-cols-2 gap-3">
          <Field label="PH" hint="มาตรฐาน 7.2 - 7.6">
            <input type="number" step="0.1" value={ph19} onChange={function (e) { setPh19(e.target.value); }} className={inputCls + (isOutOfRange(ph19, 7.2, 7.6) ? " border-red-500 ring-1 ring-red-500/40" : "")} />
          </Field>
          <Field label="CL (ppm)" hint="มาตรฐาน 1.5 - 3.0">
            <input type="number" step="0.1" value={cl19} onChange={function (e) { setCl19(e.target.value); }} className={inputCls + (isOutOfRange(cl19, 1.5, 3.0) ? " border-red-500 ring-1 ring-red-500/40" : "")} />
          </Field>
          <Field label="Pressure Filter 1 (PSI)"><input type="number" value={p1_19} onChange={function (e) { setP1_19(e.target.value); }} className={inputCls} /></Field>
          <Field label="Pressure Filter 2 (PSI)"><input type="number" value={p2_19} onChange={function (e) { setP2_19(e.target.value); }} className={inputCls} /></Field>
        </div>
      </Section>
      <Section title="การล้างถังกรอง / หมายเหตุ">
        <div className="flex gap-4 mb-3">
          <label className="flex items-center gap-2 text-sm text-neutral-300"><input type="checkbox" checked={clean1} onChange={function (e) { setClean1(e.target.checked); }} className="w-4 h-4 accent-amber-500" />ล้าง Filter No.1</label>
          <label className="flex items-center gap-2 text-sm text-neutral-300"><input type="checkbox" checked={clean2} onChange={function (e) { setClean2(e.target.checked); }} className="w-4 h-4 accent-amber-500" />ล้าง Filter No.2</label>
        </div>
        <Field label="Remark"><input value={remark} onChange={function (e) { setRemark(e.target.value); }} className={inputCls} /></Field>
        <div className="mt-3"><Field label="Checked by"><input value={checkedBy} onChange={function (e) { setCheckedBy(e.target.value); }} className={inputCls} /></Field></div>
      </Section>
      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {entry ? (
        <button onClick={handleDeleteClick} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบข้อมูลวันนี้</button>
      ) : null}
    </div>
  );
}

function PoolMonthView(props) {
  const monthStr = props.monthStr;
  const onMonthChange = props.onMonthChange;
  const records = props.records;
  const onEditDay = props.onEditDay;
  const onSaveMeta = props.onSaveMeta;
  const [popupBlocked, setPopupBlocked] = useState(false);

  const meta = records["meta:" + monthStr] || {};
  const [chiefEngineerName, setChiefEngineerName] = useState(meta.chiefEngineerName || "");
  const [signature, setSignature] = useState(meta.signature || "");
  const [signDate, setSignDate] = useState(meta.signDate || todayISO());

  useEffect(function () {
    const m = records["meta:" + monthStr] || {};
    setChiefEngineerName(m.chiefEngineerName || "");
    setSignature(m.signature || "");
    setSignDate(m.signDate || todayISO());
  }, [monthStr]);

  const bits = monthStr.split("-");
  const year = parseInt(bits[0], 10);
  const month = parseInt(bits[1], 10);
  const dCount = daysInMonth(year, month);
  const days = [];
  for (let i = 1; i <= dCount; i++) days.push(i);

  function dateKeyFor(d) { return year + "-" + pad2(month) + "-" + pad2(d); }

  function handleExport() {
    const ok = openPrintWindow(buildPoolMonthReportHtml(monthStr, records), "Pool_" + monthStr, "report-dark");
    setPopupBlocked(!ok);
  }

  function handleSaveMeta() {
    onSaveMeta(monthStr, { chiefEngineerName: chiefEngineerName, signature: signature, signDate: signDate });
  }

  return (
    <div className="space-y-4 pb-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div className="w-full sm:w-56"><MonthYearField value={monthStr} onChange={onMonthChange} /></div>

        <div className="text-center mb-3">
          <div className="font-serif text-lg font-semibold text-amber-200">PRESIDENT PLACE</div>
          <div className="text-xs text-neutral-500">Swimming Pool Operation Log Sheet - {THAI_MONTHS[month - 1]} {year}</div>
        </div>
        <table className="text-xs border-collapse min-w-[800px] text-neutral-300">
          <thead>
            <tr className="bg-neutral-950 text-amber-400/80">
              <th rowSpan={2} className="border border-neutral-800 px-2 py-1">วันที่</th>
              <th colSpan={4} className="border border-neutral-800 px-2 py-1">8:00 น.</th>
              <th colSpan={4} className="border border-neutral-800 px-2 py-1">19:00 น.</th>
              <th colSpan={2} className="border border-neutral-800 px-2 py-1">Cleaning</th>
              <th rowSpan={2} className="border border-neutral-800 px-2 py-1">Remark</th>
              <th rowSpan={2} className="border border-neutral-800 px-2 py-1">Checked by</th>
            </tr>
            <tr className="bg-neutral-950 text-amber-400/80">
              <th className="border border-neutral-800 px-1.5 py-1">PH</th><th className="border border-neutral-800 px-1.5 py-1">CL</th>
              <th className="border border-neutral-800 px-1.5 py-1">F1</th><th className="border border-neutral-800 px-1.5 py-1">F2</th>
              <th className="border border-neutral-800 px-1.5 py-1">PH</th><th className="border border-neutral-800 px-1.5 py-1">CL</th>
              <th className="border border-neutral-800 px-1.5 py-1">F1</th><th className="border border-neutral-800 px-1.5 py-1">F2</th>
              <th className="border border-neutral-800 px-1.5 py-1">F1</th><th className="border border-neutral-800 px-1.5 py-1">F2</th>
            </tr>
          </thead>
          <tbody>
            {days.map(function (d) {
              const key = dateKeyFor(d);
              const e = records[key] || {};
              return (
                <tr key={d} onClick={function () { onEditDay(key); }} className="hover:bg-amber-500/5 cursor-pointer">
                  <td className="border border-neutral-800 px-2 py-1 text-center font-medium text-amber-200">{d}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.ph8 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.cl8 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.p1_8 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.p2_8 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.ph19 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.cl19 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.p1_19 || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.p2_19 || ""}</td>

                  <td className="border border-neutral-800 px-1.5 py-1 text-center">{e.clean2 ? "Y" : ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1">{e.remark || ""}</td>
                  <td className="border border-neutral-800 px-1.5 py-1">{e.checkedBy || ""}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="text-[10px] text-neutral-600 mt-2">แตะแถวเพื่อแก้ไข/ลบข้อมูลวันนั้น</div>
      </div>

      <Section title="ผู้ตรวจสอบรายงาน (Chief Engineer)">
        <Field label="ชื่อ Chief Engineer"><input value={chiefEngineerName} onChange={function (e) { setChiefEngineerName(e.target.value); }} className={inputCls} /></Field>
        <div className="mt-3">

      </Section>
    </div>
  );

function RoomCheckUnitEditor(props) {
  const idx = props.idx;
  const unit = props.unit;
  const onChange = props.onChange;

  function set(field, value) {
    const next = {};
    for (const k in unit) next[k] = unit[k];
    next[field] = value;
    onChange(idx, next);
  }
  function setInspection(itemId, status) {
    const cur = unit.inspection || {};
    const next = {};
    for (const k in cur) next[k] = cur[k];
    next[itemId] = cur[itemId] === status ? null : status;
    const nextUnit = {};
    for (const k in unit) nextUnit[k] = unit[k];
    nextUnit.inspection = next;
    onChange(idx, nextUnit);
  }

  return (
    <Section title={"เครื่องที่ " + (idx + 1) + " (Unit " + (idx + 1) + ")"}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Model / Serial No."><input value={unit.modelSerial} onChange={function (e) { set("modelSerial", e.target.value); }} className={inputCls} /></Field>
        <Field label="Capacity">
          <div className="flex gap-2">
            <input value={unit.capacityBtu} onChange={function (e) { set("capacityBtu", e.target.value); }} placeholder="BTU" className={inputCls} />
            <input value={unit.capacityTr} onChange={function (e) { set("capacityTr", e.target.value); }} placeholder="TR" className={inputCls} />
          </div>
        </Field>
        <Field label="Refrigerant Type">
          <div className="flex flex-wrap gap-1.5">
            {REFRIGERANT_TYPES.map(function (rt) {
              const active = unit.refrigerantType === rt;
              return (
                <button key={rt} type="button" onClick={function () { set("refrigerantType", active ? "" : rt); }}
                  className={"px-2.5 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                  {rt}
                </button>
              );
            })}
          </div>
          {unit.refrigerantType === "Other" ? (
            <input value={unit.refrigerantOther} onChange={function (e) { set("refrigerantOther", e.target.value); }} placeholder="ระบุชนิดสารทำความเย็น" className={inputCls + " mt-2"} />
          ) : null}
        </Field>
        <Field label="Power Supply">
          <div className="flex gap-2">
            <input value={unit.powerV} onChange={function (e) { set("powerV", e.target.value); }} placeholder="V" className={inputCls} />
            <input value={unit.powerPh} onChange={function (e) { set("powerPh", e.target.value); }} placeholder="Ph" className={inputCls} />
          </div>
        </Field>
        <Field label="Circuit Breaker Rating"><input value={unit.breakerA} onChange={function (e) { set("breakerA", e.target.value); }} placeholder="A" className={inputCls} /></Field>
        <Field label="Rated Running Current"><input value={unit.ratedA} onChange={function (e) { set("ratedA", e.target.value); }} placeholder="A" className={inputCls} /></Field>
        <Field label="Power Cable Size"><input value={unit.cableSize} onChange={function (e) { set("cableSize", e.target.value); }} placeholder="mm²" className={inputCls} /></Field>
        <Field label="Installation Date"><input value={unit.installDate} onChange={function (e) { set("installDate", e.target.value); }} placeholder="dd/mm/yyyy" className={inputCls} /></Field>
      </div>

      <div className="mt-4 space-y-2">
        <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Inspection Item</div>
        {FCU_INSPECTION_ITEMS.map(function (item) {
          const st = (unit.inspection || {})[item.id];
          return (
            <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
              <div className="text-sm text-neutral-300 mb-2"><span className="text-amber-500/50 mr-1">{item.id}.</span>{item.desc}</div>
              <div className="flex gap-1.5">
                <OkFaultBtn active={st === "ok"} color="green" label="OK" onClick={function () { setInspection(item.id, "ok"); }} />
                <OkFaultBtn active={st === "fault"} color="red" label="FAULT" onClick={function () { setInspection(item.id, "fault"); }} />
              </div>
            </div>
          );
        })}
      </div>
    </Section>
  );
}

function RoomCheckFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [roomNo, setRoomNo] = useState(record ? record.roomNo : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [frequency, setFrequency] = useState(record ? record.frequency : "quarterly");
  const [units, setUnits] = useState(record && record.units ? record.units : emptyRoomCheckUnits());
  const [specRemarks, setSpecRemarks] = useState(record ? record.specRemarks : "");
  const [remarks, setRemarks] = useState(record ? record.remarks : "");
  const [chiefEngineerName, setChiefEngineerName] = useState(record ? record.chiefEngineerName : "");
  const [signature, setSignature] = useState(record ? record.signature : "");
  const [error, setError] = useState("");

  function updateUnit(idx, nextUnit) {
    setUnits(function (arr) {
      const next = arr.slice();
      next[idx] = nextUnit;
      return next;
    });
  }

  function handleSave() {
    if (!roomNo || !date) {
      setError("กรุณากรอกเลขห้องพัก และวันที่ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      roomNo: roomNo, date: date, inspector: inspector, frequency: frequency,
      units: units, specRemarks: specRemarks, remarks: remarks,
      chiefEngineerName: chiefEngineerName, signature: signature
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Room No."><input value={roomNo} onChange={function (e) { setRoomNo(e.target.value); }} className={inputCls} placeholder="เช่น 1801" /></Field>
          <Field label="Date (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          <Field label="Inspector"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          <Field label="Frequency">
            <div className="flex flex-wrap gap-1.5">
              {ROOM_CHECK_FREQUENCIES.map(function (f) {
                const active = frequency === f.key;
                return (
                  <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                    className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                    {f.label}
                  </button>
                );
              })}
            </div>
          </Field>
        </div>
      </Section>

      {units.map(function (unit, idx) {
        return <RoomCheckUnitEditor key={idx} idx={idx} unit={unit} onChange={updateUnit} />;
      })}

      <Section title="Remarks (ข้อมูลเครื่อง)">
        <textarea value={specRemarks} onChange={function (e) { setSpecRemarks(e.target.value); }} rows={3} className={inputCls} placeholder="หมายเหตุเกี่ยวกับข้อมูลเครื่อง (Model / Capacity / ฯลฯ)" />
      </Section>

      <Section title="Remarks">
        <textarea value={remarks} onChange={function (e) { setRemarks(e.target.value); }} rows={3} className={inputCls} placeholder="หมายเหตุเพิ่มเติม" />
      </Section>

      <Section title="Chief Engineer">
        <Field label="ชื่อ Chief Engineer"><input value={chiefEngineerName} onChange={function (e) { setChiefEngineerName(e.target.value); }} className={inputCls} /></Field>
        <div className="mt-3">
          <label className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1 block">ลายเซ็น</label>
          <SignaturePad value={signature} onChange={setSignature} />
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (
        <button onClick={handleDelete} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบรายการนี้</button>
      ) : null}
    </div>
  );
}

function RoomCheckListView(props) {
  const records = props.records;
  const onSelect = props.onSelect;
  const onNew = props.onNew;
  const onDelete = props.onDelete;

  function handleDeleteClick(e, id) {
    e.stopPropagation();
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(id);
    }
  }
  function countFault(r) {
    let n = 0;
    const units = r.units || [];
    for (let i = 0; i < units.length; i++) {
      const insp = units[i].inspection || {};
      for (const k in insp) { if (insp[k] === "fault") n++; }
    }
    return n;
  }

  return (
    <div className="space-y-3">
      <button onClick={onNew} className="w-full bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPlus size={16} />บันทึกใหม่</button>
      {records.length === 0 ? <div className="text-center text-neutral-500 text-sm py-10">ยังไม่มีข้อมูล</div> : null}
      {records.map(function (r) {
        const faultCount = countFault(r);
        return (
          <button key={r.id} onClick={function () { onSelect(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3.5 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
            <div className="min-w-0">
              <div className="font-medium text-neutral-200 text-sm truncate">ห้อง {r.roomNo} · {r.frequency || "quarterly"}</div>
              <div className="text-xs text-neutral-500 mt-0.5">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {faultCount > 0 ? <span className="text-xs bg-red-500/15 text-red-300 px-2 py-0.5 rounded-full border border-red-500/30">{faultCount} FAULT</span> : null}
              <button onClick={function (e) { handleDeleteClick(e, r.id); }} className="text-neutral-500 hover:text-red-400 p-1"><IconTrash size={16} /></button>
              <IconChevronRight size={18} className="text-amber-500/40" />
            </div>
          </button>
        );
      })}
    </div>
  );
}

function buildRoomCheckReportHtml(record) {
  const units = record.units || [];
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT PLACE</div><div class=\"report-subtitle\">QUARTERLY INSPECTION CHECKLIST</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Room No.:</b> " + escapeHtml(record.roomNo) + "</div>");
  parts.push("<div><b>Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(record.frequency || "-") + "</div>");
  parts.push("</div>");

  const specRows = [
    ["Model / Serial No.", function (u) { return u.modelSerial || "-"; }],
    ["Capacity", function (u) { return (u.capacityBtu || "-") + " BTU / " + (u.capacityTr || "-") + " TR"; }],
    ["Refrigerant Type", function (u) { return (u.refrigerantType || "-") + (u.refrigerantType === "Other" && u.refrigerantOther ? (" (" + u.refrigerantOther + ")") : ""); }],
    ["Power Supply", function (u) { return (u.powerV || "-") + " V / " + (u.powerPh || "-") + " Ph"; }],
    ["Circuit Breaker Rating", function (u) { return (u.breakerA || "-") + " A"; }],
    ["Rated Running Current", function (u) { return (u.ratedA || "-") + " A"; }],
    ["Power Cable Size", function (u) { return (u.cableSize || "-") + " mm\u00b2"; }],
    ["Installation Date", function (u) { return u.installDate || "-"; }]
  ];
  let specTable = "<table class=\"checklist-table\"><thead><tr><th>Description</th>";
  for (let i = 0; i < units.length; i++) specTable += "<th>Unit " + (i + 1) + "</th>";
  specTable += "<th>Remarks</th>";
  specTable += "</tr></thead><tbody>";
  for (let r = 0; r < specRows.length; r++) {
    specTable += "<tr><td>" + specRows[r][0] + "</td>";
    for (let i = 0; i < units.length; i++) { specTable += "<td>" + escapeHtml(specRows[r][1](units[i])) + "</td>"; }
    if (r === 0) {
      specTable += "<td rowspan=\"" + specRows.length + "\" style=\"white-space:pre-wrap;vertical-align:top;\">" + escapeHtml(record.specRemarks || "") + "</td>";
    }
    specTable += "</tr>";
  }
  specTable += "</tbody></table>";
  parts.push(specTable);

  let inspTable = "<table class=\"checklist-table\"><thead><tr><th>Inspection Item</th>";
  for (let i = 0; i < units.length; i++) inspTable += "<th>Unit " + (i + 1) + "</th>";
  inspTable += "</tr></thead><tbody>";
  for (let it = 0; it < FCU_INSPECTION_ITEMS.length; it++) {
    const item = FCU_INSPECTION_ITEMS[it];
    inspTable += "<tr><td>" + item.id + ". " + escapeHtml(item.desc) + "</td>";
    for (let i = 0; i < units.length; i++) {
      const st = (units[i].inspection || {})[item.id];
      let label = "-"; let color = "#9ca3af";
      if (st === "ok") { label = "OK"; color = "#16a34a"; }
      else if (st === "fault") { label = "FAULT"; color = "#dc2626"; }
      inspTable += "<td style=\"text-align:center;color:" + color + ";font-weight:600;\">" + label + "</td>";
    }
    inspTable += "</tr>";
  }
  inspTable += "</tbody></table>";
  parts.push(inspTable);

  if (record.remarks) {
    parts.push("<div class=\"op-data-title\">REMARKS</div>");
    parts.push("<div style=\"font-size:12px;margin-bottom:16px;\">" + escapeHtml(record.remarks) + "</div>");
  }
  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Chief Engineer</div><div class=\"sig-name\">" + escapeHtml(record.chiefEngineerName || "-") + "</div>");
  if (record.signature) { parts.push("<img src=\"" + record.signature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("</div>");
  return parts.join("");
}

                <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Power Supply</span><span>{unit.powerV || "-"} V / {unit.powerPh || "-"} Ph</span></div>
                <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Breaker</span><span>{unit.breakerA || "-"} A</span></div>
                <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Rated Current</span><span>{unit.ratedA || "-"} A</span></div>
                <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Cable Size</span><span>{unit.cableSize || "-"} mm²</span></div>

                        <td className="py-1.5 text-neutral-300">{item.desc}</td>
                        <td className="py-1.5 text-center w-14">
                          {st === "ok" ? <span className="text-emerald-400 font-medium">OK</span> : null}
                          {st === "fault" ? <span className="text-red-400 font-medium">FAULT</span> : null}
                          {!st ? <span className="text-neutral-700">-</span> : null}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })}

        {record.remarks ? (
          <div className="mb-4">
            <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">Remarks</div>
            <div className="text-xs text-neutral-300 whitespace-pre-wrap">{record.remarks}</div>
          </div>
        ) : null}
        <div className="pt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Chief Engineer</div>

          {record.signature ? <img src={record.signature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
        </div>
      </div>
    </div>
  );
}

function RoomEquipCheckFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [roomNo, setRoomNo] = useState(record ? record.roomNo : "");
  const [floor, setFloor] = useState(record ? record.floor : "");
  const [roomType, setRoomType] = useState(record ? record.roomType : "");
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [frequency, setFrequency] = useState(record ? record.frequency : "quarterly");
  const [inspection, setInspection] = useState(record && record.inspection ? record.inspection : {});
  const [inspectorSignature, setInspectorSignature] = useState(record ? record.inspectorSignature : "");
  const [inspectorSignDate, setInspectorSignDate] = useState(record ? record.inspectorSignDate : todayISO());
  const [acknowledgedByName, setAcknowledgedByName] = useState(record ? record.acknowledgedByName : "");
  const [acknowledgedSignature, setAcknowledgedSignature] = useState(record ? record.acknowledgedSignature : "");
  const [acknowledgedSignDate, setAcknowledgedSignDate] = useState(record ? record.acknowledgedSignDate : todayISO());
  const [error, setError] = useState("");

  function setItemStatus(id, status) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status === status ? null : status, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemRemark(id, remark) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status || null, remark: remark || "" };
      return next;
    });
  }

  function handleSave() {
    if (!roomNo || !date) {
      setError("กรุณากรอกหมายเลขห้อง และวันที่ตรวจสอบ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      roomNo: roomNo, floor: floor, roomType: roomType, inspector: inspector,
      date: date, frequency: frequency, inspection: inspection,
      inspectorSignature: inspectorSignature, inspectorSignDate: inspectorSignDate,
      acknowledgedByName: acknowledgedByName, acknowledgedSignature: acknowledgedSignature, acknowledgedSignDate: acknowledgedSignDate
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป / General Information">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Room No. / หมายเลขห้อง"><input value={roomNo} onChange={function (e) { setRoomNo(e.target.value); }} className={inputCls} placeholder="เช่น 1801" /></Field>
          <Field label="Floor / ชั้น"><input value={floor} onChange={function (e) { setFloor(e.target.value); }} className={inputCls} /></Field>
          <Field label="Room Type / ประเภทห้อง"><input value={roomType} onChange={function (e) { setRoomType(e.target.value); }} className={inputCls} /></Field>
          <Field label="Inspector / ผู้ตรวจสอบ"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          <div className="sm:col-span-2">
            <Field label="Inspection Date (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Frequency">
              <div className="flex flex-wrap gap-1.5">
                {ROOM_EQUIP_FREQUENCIES.map(function (f) {
                  const active = frequency === f.key;
                  return (
                    <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {f.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
        </div>
      </Section>

      <div className="text-[11px] text-neutral-500 px-2 flex flex-wrap gap-3">
        {ROOM_EQUIP_STATUS_OPTIONS.map(function (o) {
          return <span key={o.key}>{o.emoji} {o.label}</span>;
        })}
      </div>

      {ROOM_EQUIP_SECTIONS.map(function (sec) {
        return (
          <Section key={sec.id} title={sec.icon + " " + sec.name}>
            <div className="space-y-2">
              {sec.items.map(function (item) {
                const cur = inspection[item.id] || {};
                const st = cur.status;
                return (
                  <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                    <div className="text-sm text-neutral-300 mb-2">{item.th} <span className="text-neutral-500">/ {item.en}</span></div>
                    <div className="flex gap-1.5">
                      {ROOM_EQUIP_STATUS_OPTIONS.map(function (o) {
                        return (
                          <EquipStatusBtn key={o.key} active={st === o.key} opt={o}
                            onClick={function () { setItemStatus(item.id, o.key); }} />
                        );
                      })}
                    </div>
                    <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder="หมายเหตุ" className="mt-2 w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                  </div>
                );
              })}
            </div>
          </Section>
        );
      })}

      <Section title="ลงชื่อผู้ตรวจสอบ / Inspector's Signature">
        <SignaturePad value={inspectorSignature} onChange={setInspectorSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={inspectorSignDate} onChange={setInspectorSignDate} /></Field>
        </div>
      </Section>

      <Section title="ลงชื่อผู้รับทราบ / Acknowledged By">
        <Field label="ชื่อผู้รับทราบ"><input value={acknowledgedByName} onChange={function (e) { setAcknowledgedByName(e.target.value); }} className={inputCls} /></Field>
        <div className="mt-3">
          <SignaturePad value={acknowledgedSignature} onChange={setAcknowledgedSignature} />
        </div>
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={acknowledgedSignDate} onChange={setAcknowledgedSignDate} /></Field>
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (
        <button onClick={handleDelete} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบรายการนี้</button>
      ) : null}
    </div>
  );
}

function RoomEquipCheckListView(props) {
  const records = props.records;
  const onSelect = props.onSelect;
  const onNew = props.onNew;
  const onDelete = props.onDelete;

  function handleDeleteClick(e, id) {
    e.stopPropagation();
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(id);
    }
  }
  function countIssue(r) {
    let n = 0;
    const insp = r.inspection || {};
    for (const k in insp) { if (insp[k] && (insp[k].status === "damaged" || insp[k].status === "repair")) n++; }
    return n;
  }

  return (
    <div className="space-y-3">
      <button onClick={onNew} className="w-full bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPlus size={16} />บันทึกใหม่</button>
      {records.length === 0 ? <div className="text-center text-neutral-500 text-sm py-10">ยังไม่มีข้อมูล</div> : null}
      {records.map(function (r) {
        const issueCount = countIssue(r);
        return (
          <button key={r.id} onClick={function () { onSelect(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3.5 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
            <div className="min-w-0">
              <div className="font-medium text-neutral-200 text-sm truncate">ห้อง {r.roomNo} · ชั้น {r.floor || "-"} · {r.frequency || "quarterly"}</div>
              <div className="text-xs text-neutral-500 mt-0.5">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {issueCount > 0 ? <span className="text-xs bg-red-500/15 text-red-300 px-2 py-0.5 rounded-full border border-red-500/30">{issueCount} ปัญหา</span> : null}
              <button onClick={function (e) { handleDeleteClick(e, r.id); }} className="text-neutral-500 hover:text-red-400 p-1"><IconTrash size={16} /></button>
              <IconChevronRight size={18} className="text-amber-500/40" />
            </div>
          </button>
        );
      })}
    </div>
  );
}

function buildRoomEquipCheckReportHtml(record) {
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT PLACE</div><div class=\"report-subtitle\">ROOM EQUIPMENT INSPECTION CHECKLIST</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Room No.:</b> " + escapeHtml(record.roomNo) + "</div>");
  parts.push("<div><b>Floor:</b> " + escapeHtml(record.floor || "-") + "</div>");
  parts.push("<div><b>Room Type:</b> " + escapeHtml(record.roomType || "-") + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("<div><b>Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(record.frequency || "-") + "</div>");
  parts.push("</div>");

  const statusMap = {};
  ROOM_EQUIP_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });

  ROOM_EQUIP_SECTIONS.forEach(function (sec) {
    let table = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
    table += "<table class=\"checklist-table\"><thead><tr><th>Item</th><th>Status</th><th>Remark</th></tr></thead><tbody>";
    sec.items.forEach(function (item) {
      const v = (record.inspection && record.inspection[item.id]) || {};
      let label = "-"; let color = "#9ca3af";
      const opt = statusMap[v.status];
      if (opt) {
        label = opt.emoji + " " + opt.label;
        color = opt.color === "green" ? "#16a34a" : (opt.color === "red" ? "#dc2626" : "#d97706");
      }
      table += "<tr><td>" + escapeHtml(item.th) + " / " + escapeHtml(item.en) + "</td><td style=\"color:" + color + ";font-weight:600;\">" + label + "</td><td>" + escapeHtml(v.remark || "") + "</td></tr>";
    });
    table += "</tbody></table>";
    parts.push(table);
  });

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Inspector's Signature / ผู้ตรวจสอบ</div><div class=\"sig-name\">" + escapeHtml(record.inspector || "-") + "</div>");
  if (record.inspectorSignature) { parts.push("<img src=\"" + record.inspectorSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.inspectorSignDate || "") + "</div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Acknowledged by / ผู้รับทราบ</div><div class=\"sig-name\">" + escapeHtml(record.acknowledgedByName || "-") + "</div>");
  if (record.acknowledgedSignature) { parts.push("<img src=\"" + record.acknowledgedSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.acknowledgedSignDate || "") + "</div>");
  parts.push("</div>");

  return parts.join("");
}

function FirePumpFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [pumpId, setPumpId] = useState(record ? record.pumpId : "");
  const [pumpType, setPumpType] = useState(record ? record.pumpType : FIRE_PUMP_TYPES[0].key);
  const [location, setLocation] = useState(record ? record.location : "");
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [frequency, setFrequency] = useState(record ? record.frequency : "quarterly");
  const [inspection, setInspection] = useState(record && record.inspection ? record.inspection : {});
  const [correctiveActions, setCorrectiveActions] = useState(record ? record.correctiveActions : "");
  const [inspectorSignature, setInspectorSignature] = useState(record ? record.inspectorSignature : "");
  const [inspectorSignDate, setInspectorSignDate] = useState(record ? record.inspectorSignDate : todayISO());
  const [error, setError] = useState("");

  function setItemStatus(id, status) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status === status ? null : status, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemRemark(id, remark) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status || null, remark: remark || "" };
      return next;
    });
  }

  function handleSave() {
    if (!pumpId || !date) {
      setError("กรุณากรอกรหัสปั๊ม และวันที่ตรวจสอบ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      pumpId: pumpId, pumpType: pumpType, location: location, inspector: inspector,
      date: date, frequency: frequency, inspection: inspection, correctiveActions: correctiveActions,
      inspectorSignature: inspectorSignature, inspectorSignDate: inspectorSignDate
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป / General Information">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="รหัสปั๊ม / Pump ID"><input value={pumpId} onChange={function (e) { setPumpId(e.target.value); }} className={inputCls} placeholder="เช่น FP-01" /></Field>
          <Field label="ตำแหน่ง / Location"><input value={location} onChange={function (e) { setLocation(e.target.value); }} className={inputCls} placeholder="เช่น ห้องปั๊มดับเพลิง Tower B" /></Field>
          <div className="sm:col-span-2">
            <Field label="ประเภท / Type">
              <div className="flex flex-wrap gap-1.5">
                {FIRE_PUMP_TYPES.map(function (t) {
                  const active = pumpType === t.key;
                  return (
                    <button key={t.key} type="button" onClick={function () { setPumpType(t.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {t.th} <span className="text-neutral-500">({t.en})</span>
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <Field label="ผู้ตรวจ / Inspector"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          <Field label="วันที่ตรวจ / Date (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          <div className="sm:col-span-2">
            <Field label="Frequency">
              <div className="flex flex-wrap gap-1.5">
                {FIRE_PUMP_FREQUENCIES.map(function (f) {
                  const active = frequency === f.key;
                  return (
                    <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {f.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
        </div>
      </Section>

      <div className="text-[11px] text-neutral-500 px-2 flex flex-wrap gap-3">
        {FIRE_PUMP_STATUS_OPTIONS.map(function (o) {
          return <span key={o.key}>{o.emoji} {o.label}</span>;
        })}
      </div>

      {FIRE_PUMP_SECTIONS.map(function (sec) {
        return (
          <Section key={sec.id} title={sec.icon + " " + sec.name}>
            <div className="space-y-2">
              {sec.items.map(function (item) {
                const cur = inspection[item.id] || {};
                const st = cur.status;
                return (
                  <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                    <div className="text-sm text-neutral-300 mb-2">{item.th} <span className="text-neutral-500">/ {item.en}</span></div>
                    <div className="flex gap-1.5">
                      {FIRE_PUMP_STATUS_OPTIONS.map(function (o) {
                        return (
                          <EquipStatusBtn key={o.key} active={st === o.key} opt={o}
                            onClick={function () { setItemStatus(item.id, o.key); }} />
                        );
                      })}
                    </div>
                    <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder={item.hint ? ("หมายเหตุ เช่น " + item.hint) : "หมายเหตุ"} className="mt-2 w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                  </div>
                );
              })}
            </div>
          </Section>
        );
      })}

      <Section title="รายการแก้ไข / Corrective Actions">
        <textarea value={correctiveActions} onChange={function (e) { setCorrectiveActions(e.target.value); }} rows={4}
          placeholder="ระบุรายการที่ต้องแก้ไข (ถ้ามี)" className={inputCls + " resize-none"}></textarea>
      </Section>

      <Section title="ลงชื่อผู้ตรวจสอบ / Inspector's Signature">
        <SignaturePad value={inspectorSignature} onChange={setInspectorSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={inspectorSignDate} onChange={setInspectorSignDate} /></Field>
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (
        <button onClick={handleDelete} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบรายการนี้</button>
      ) : null}
    </div>
  );
}

function FirePumpListView(props) {
  const records = props.records;
  const onSelect = props.onSelect;
  const onNew = props.onNew;
  const onDelete = props.onDelete;

  function handleDeleteClick(e, id) {
    e.stopPropagation();
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(id);
    }
  }
  function countIssue(r) {
    let n = 0;
    const insp = r.inspection || {};
    for (const k in insp) { if (insp[k] && (insp[k].status === "urgent" || insp[k].status === "check")) n++; }
    return n;
  }

  return (
    <div className="space-y-3">
      <button onClick={onNew} className="w-full bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPlus size={16} />บันทึกใหม่</button>
      {records.length === 0 ? <div className="text-center text-neutral-500 text-sm py-10">ยังไม่มีข้อมูล</div> : null}
      {records.map(function (r) {
        const issueCount = countIssue(r);
        return (
          <button key={r.id} onClick={function () { onSelect(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3.5 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
            <div className="min-w-0">
              <div className="font-medium text-neutral-200 text-sm truncate">{r.pumpId || "-"} · {firePumpTypeLabel(r.pumpType)} · {r.frequency || "quarterly"}</div>
              <div className="text-xs text-neutral-500 mt-0.5">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {issueCount > 0 ? <span className="text-xs bg-red-500/15 text-red-300 px-2 py-0.5 rounded-full border border-red-500/30">{issueCount} ปัญหา</span> : null}
              <button onClick={function (e) { handleDeleteClick(e, r.id); }} className="text-neutral-500 hover:text-red-400 p-1"><IconTrash size={16} /></button>
              <IconChevronRight size={18} className="text-amber-500/40" />
            </div>
          </button>
        );
      })}
    </div>
  );
}

function buildFirePumpReportHtml(record) {
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT HOTEL AND TOWER</div><div class=\"report-subtitle\">QUARTERLY FIRE PUMP INSPECTION CHECKLIST</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Pump ID:</b> " + escapeHtml(record.pumpId) + "</div>");
  parts.push("<div><b>Type:</b> " + escapeHtml(firePumpTypeLabel(record.pumpType)) + "</div>");
  parts.push("<div><b>Location:</b> " + escapeHtml(record.location || "-") + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("<div><b>Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(record.frequency || "-") + "</div>");
  parts.push("</div>");

  const statusMap = {};
  FIRE_PUMP_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });

  FIRE_PUMP_SECTIONS.forEach(function (sec) {
    let table = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
    table += "<table class=\"checklist-table\"><thead><tr><th>Item</th><th>Status</th><th>Remark</th></tr></thead><tbody>";
    sec.items.forEach(function (item) {
      const v = (record.inspection && record.inspection[item.id]) || {};
      let label = "-"; let color = "#9ca3af";
      const opt = statusMap[v.status];
      if (opt) {
        label = opt.emoji + " " + opt.label;
        color = opt.color === "green" ? "#16a34a" : (opt.color === "red" ? "#dc2626" : "#d97706");
      }
      table += "<tr><td>" + escapeHtml(item.th) + " / " + escapeHtml(item.en) + "</td><td style=\"color:" + color + ";font-weight:600;\">" + label + "</td><td>" + escapeHtml(v.remark || "") + "</td></tr>";
    });
    table += "</tbody></table>";
    parts.push(table);
  });

  parts.push("<div class=\"op-data-title\">รายการแก้ไข / Corrective Actions</div>");
  parts.push("<div style=\"white-space:pre-wrap;font-size:12px;padding:6px 0;\">" + (escapeHtml(record.correctiveActions || "-")) + "</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Inspector's Signature / ผู้ตรวจสอบ</div><div class=\"sig-name\">" + escapeHtml(record.inspector || "-") + "</div>");
  if (record.inspectorSignature) { parts.push("<img src=\"" + record.inspectorSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.inspectorSignDate || "") + "</div>");
  parts.push("</div>");

  return parts.join("");
}

function FirePumpReportView(props) {
  const record = props.record;

  function handleDeleteClick() {

          <div><span className="text-neutral-500">Location:</span> {record.location || "-"}</div>
          <div><span className="text-neutral-500">Inspector:</span> {record.inspector || "-"}</div>
          <div><span className="text-neutral-500">Date:</span> {formatThaiDate(record.date)}</div>
          <div><span className="text-neutral-500">Frequency:</span> {record.frequency || "-"}</div>
        </div>

        {FIRE_PUMP_SECTIONS.map(function (sec) {
          return (
            <div key={sec.id} className="mb-4">
              <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">{sec.icon} {sec.name}</div>
              <table className="w-full text-xs">
                <tbody>
                  {sec.items.map(function (item) {
                    const v = (record.inspection && record.inspection[item.id]) || {};
                    const opt = statusMap[v.status];
                    return (
                      <tr key={item.id} className="border-b border-neutral-800/70">
                        <td className="py-1.5 text-neutral-300">{item.th} <span className="text-neutral-500">/ {item.en}</span></td>
                        <td className="py-1.5 text-center w-32">
                          {opt ? (
                            <span className={opt.color === "green" ? "text-emerald-400 font-medium" : (opt.color === "red" ? "text-red-400 font-medium" : "text-amber-400 font-medium")}>

                            </span>
                          ) : <span className="text-neutral-700">-</span>}

                      </tr>
                    );

          );

        <div className="pt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">รายการแก้ไข / Corrective Actions</div>
