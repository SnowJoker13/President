      <div className="bg-neutral-900 rounded-xl border border-neutral-800 border-t-2 border-t-amber-500/40 shadow-lg shadow-black/30 p-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-300 flex items-center justify-center"><IconZap size={20} /></div>
          <div>
            <div className="font-serif font-semibold text-amber-100">Quarterly Generator Inspection & Testing</div>
            <div className="text-xs text-neutral-500">{count} รายการที่บันทึกไว้ทั้งหมด · ปี 2569</div>
          </div>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <button onClick={onNew} className="bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-xl py-4 flex flex-col items-center justify-center gap-1.5 shadow-lg shadow-amber-500/10 font-medium">
          <IconPlus size={20} /><span className="text-sm">บันทึกใหม่</span>
        </button>
        <button onClick={onHistory} className="bg-neutral-900 border border-amber-500/25 rounded-xl py-4 flex flex-col items-center justify-center gap-1.5 text-amber-200">
          <IconHistory size={20} /><span className="text-sm font-medium">ดูประวัติทั้งหมด</span>
        </button>
      </div>
      {recent.length > 0 ? (
        <div>
          <div className="text-[11px] uppercase tracking-wide text-amber-500/60 mb-2 px-1">รายการล่าสุด</div>
          <div className="space-y-2">
            {recent.map(function (r) {
              return (
                <button key={r.id} onClick={function () { onOpenReport(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-neutral-200 truncate">{r.unitId || "-"} · {generatorFuelTypeLabel(r.fuelType, r.fuelTypeOther)} · {r.frequency || "quarterly"}</div>
                    <div className="text-xs text-neutral-500">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
                  </div>
                  <IconChevronRight size={16} className="text-amber-500/40 shrink-0" />
                </button>
              );
            })}
          </div>
        </div>
      ) : null}
    </div>
  );
}

function GeneratorFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [unitId, setUnitId] = useState(record ? record.unitId : "");
  const [makeModel, setMakeModel] = useState(record ? record.makeModel : "");
  const [ratedOutputKva, setRatedOutputKva] = useState(record ? record.ratedOutputKva : "");
  const [ratedOutputKw, setRatedOutputKw] = useState(record ? record.ratedOutputKw : "");
  const [voltageV, setVoltageV] = useState(record ? record.voltageV : "");
  const [voltagePhase, setVoltagePhase] = useState(record ? record.voltagePhase : "");
  const [voltageHz, setVoltageHz] = useState(record ? record.voltageHz : "");
  const [fuelType, setFuelType] = useState(record ? record.fuelType : GENERATOR_FUEL_TYPES[0].key);
  const [fuelTypeOther, setFuelTypeOther] = useState(record ? record.fuelTypeOther : "");
  const [location, setLocation] = useState(record ? record.location : "");
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [frequency, setFrequency] = useState(record ? record.frequency : "quarterly");
  const [overallStatus, setOverallStatus] = useState(record ? record.overallStatus : "");
  const [inspection, setInspection] = useState(record && record.inspection ? record.inspection : {});
  const [inspectorSignature, setInspectorSignature] = useState(record ? record.inspectorSignature : "");
  const [inspectorSignDate, setInspectorSignDate] = useState(record ? record.inspectorSignDate : todayISO());
  const [acknowledgedByName, setAcknowledgedByName] = useState(record ? record.acknowledgedByName : "");
  const [acknowledgedPosition, setAcknowledgedPosition] = useState(record ? record.acknowledgedPosition : "");
  const [acknowledgedSignature, setAcknowledgedSignature] = useState(record ? record.acknowledgedSignature : "");
  const [acknowledgedSignDate, setAcknowledgedSignDate] = useState(record ? record.acknowledgedSignDate : todayISO());
  const [error, setError] = useState("");

  function setItemStatus(id, status) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status === status ? null : status, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemRemark(id, remark) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { status: cur.status || null, remark: remark || "" };
      return next;
    });
  }

  function handleSave() {
    if (!unitId || !date) {
      setError("กรุณากรอกรหัสเครื่อง และวันที่ตรวจสอบ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      unitId: unitId, makeModel: makeModel, ratedOutputKva: ratedOutputKva, ratedOutputKw: ratedOutputKw,
      voltageV: voltageV, voltagePhase: voltagePhase, voltageHz: voltageHz,
      fuelType: fuelType, fuelTypeOther: fuelTypeOther, location: location, inspector: inspector,
      date: date, frequency: frequency, overallStatus: overallStatus,
      inspection: inspection,
      inspectorSignature: inspectorSignature, inspectorSignDate: inspectorSignDate,
      acknowledgedByName: acknowledgedByName, acknowledgedPosition: acknowledgedPosition,
      acknowledgedSignature: acknowledgedSignature, acknowledgedSignDate: acknowledgedSignDate
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป / General Information">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="รหัสเครื่อง / Unit ID"><input value={unitId} onChange={function (e) { setUnitId(e.target.value); }} className={inputCls} placeholder="เช่น GEN-01" /></Field>
          <Field label="ยี่ห้อ-รุ่น / Make & Model"><input value={makeModel} onChange={function (e) { setMakeModel(e.target.value); }} className={inputCls} /></Field>
          <Field label="กำลังไฟฟ้า / Rated Output">
            <div className="flex gap-2">
              <input value={ratedOutputKva} onChange={function (e) { setRatedOutputKva(e.target.value); }} placeholder="kVA" className={inputCls} />
              <input value={ratedOutputKw} onChange={function (e) { setRatedOutputKw(e.target.value); }} placeholder="kW" className={inputCls} />
            </div>
          </Field>
          <Field label="แรงดันไฟฟ้า / Voltage">
            <div className="flex gap-2">
              <input value={voltageV} onChange={function (e) { setVoltageV(e.target.value); }} placeholder="V" className={inputCls} />
              <input value={voltagePhase} onChange={function (e) { setVoltagePhase(e.target.value); }} placeholder="เฟส" className={inputCls} />
              <input value={voltageHz} onChange={function (e) { setVoltageHz(e.target.value); }} placeholder="Hz" className={inputCls} />
            </div>
          </Field>
          <Field label="ประเภทเชื้อเพลิง / Fuel Type">
            <div className="flex flex-wrap gap-1.5">
              {GENERATOR_FUEL_TYPES.map(function (t) {
                const active = fuelType === t.key;
                return (
                  <button key={t.key} type="button" onClick={function () { setFuelType(t.key); }}
                    className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                    {t.th} <span className="text-neutral-500">({t.en})</span>
                  </button>
                );
              })}
            </div>
            {fuelType === "other" ? (
              <input value={fuelTypeOther} onChange={function (e) { setFuelTypeOther(e.target.value); }} placeholder="ระบุประเภทเชื้อเพลิง" className={inputCls + " mt-2"} />
            ) : null}
          </Field>
          <Field label="ตำแหน่งติดตั้ง / Location"><input value={location} onChange={function (e) { setLocation(e.target.value); }} className={inputCls} /></Field>
          <Field label="ผู้ตรวจสอบ / Inspector"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          <Field label="วันที่ตรวจ / Date (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          <div className="sm:col-span-2">
            <Field label="Frequency">
              <div className="flex flex-wrap gap-1.5">
                {GENERATOR_FREQUENCIES.map(function (f) {
                  const active = frequency === f.key;
                  return (
                    <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {f.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="สถานะโดยรวม / Overall Status">
              <div className="flex flex-wrap gap-1.5">
                {GENERATOR_STATUS_OPTIONS.map(function (o) {
                  const active = overallStatus === o.key;
                  return (
                    <button key={o.key} type="button" onClick={function () { setOverallStatus(active ? "" : o.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-1 " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      <span>{o.emoji}</span><span>{o.label}</span>
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
        </div>
      </Section>

      <div className="text-[10px] text-neutral-600 px-2">อ้างอิงมาตรฐาน: NFPA 110, NFPA 111, ISO 8528, กฎกระทรวงความปลอดภัยอาคาร</div>

      <div className="text-[11px] text-neutral-500 px-2 flex flex-wrap gap-3">
        {GENERATOR_STATUS_OPTIONS.map(function (o) {
          return <span key={o.key}>{o.emoji} {o.label}</span>;
        })}
      </div>

      {GENERATOR_SECTIONS.map(function (sec) {
        if (sec.id === "opTest") {
          return (
            <Section key={sec.id} title={sec.icon + " " + sec.name}>
              <div className="space-y-2">
                {sec.items.map(function (item) {
                  const cur = inspection[item.id] || {};
                  return (
                    <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                      <div className="text-sm text-neutral-300 mb-1">{item.th}</div>
                      <div className="text-xs text-amber-500/70 mb-2">ผลลัพธ์ / Result: {item.en}</div>
                      <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder={item.hint ? ("ค่าที่วัดได้ เช่น " + item.hint) : "ค่าที่วัดได้ / Readings"} className="w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                    </div>
                  );
                })}
              </div>
            </Section>
          );
        }
        return (
          <Section key={sec.id} title={sec.icon + " " + sec.name}>
            <div className="space-y-2">
              {sec.items.map(function (item) {
                const cur = inspection[item.id] || {};
                const st = cur.status;
                return (
                  <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                    <div className="text-sm text-neutral-300 mb-2">{item.th} <span className="text-neutral-500">/ {item.en}</span></div>
                    <div className="flex gap-1.5">
                      {GENERATOR_STATUS_OPTIONS.map(function (o) {
                        return (
                          <EquipStatusBtn key={o.key} active={st === o.key} opt={o}
                            onClick={function () { setItemStatus(item.id, o.key); }} />
                        );
                      })}
                    </div>
                    <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder={item.hint ? ("หมายเหตุ / ค่าที่วัดได้ เช่น " + item.hint) : "หมายเหตุ"} className="mt-2 w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                  </div>
                );
              })}
            </div>
          </Section>
        );
      })}

      <Section title="ลงชื่อผู้ตรวจสอบ / Inspector's Signature">
        <SignaturePad value={inspectorSignature} onChange={setInspectorSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={inspectorSignDate} onChange={setInspectorSignDate} /></Field>
        </div>
      </Section>

      <Section title="ลงชื่อผู้รับทราบ / Acknowledged By">
        <Field label="ชื่อผู้รับทราบ"><input value={acknowledgedByName} onChange={function (e) { setAcknowledgedByName(e.target.value); }} className={inputCls} /></Field>
        <div className="mt-3">
          <Field label="ตำแหน่ง / Position"><input value={acknowledgedPosition} onChange={function (e) { setAcknowledgedPosition(e.target.value); }} className={inputCls} /></Field>
        </div>
        <div className="mt-3">
          <SignaturePad value={acknowledgedSignature} onChange={setAcknowledgedSignature} />
        </div>
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={acknowledgedSignDate} onChange={setAcknowledgedSignDate} /></Field>
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (
        <button onClick={handleDelete} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบรายการนี้</button>
      ) : null}
    </div>
  );
}

function GeneratorListView(props) {
  const records = props.records;
  const onSelect = props.onSelect;
  const onNew = props.onNew;
  const onDelete = props.onDelete;

  function handleDeleteClick(e, id) {
    e.stopPropagation();
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(id);
    }
  }
  function countIssue(r) {
    let n = 0;
    const insp = r.inspection || {};
    for (const k in insp) { if (insp[k] && (insp[k].status === "repair" || insp[k].status === "watch")) n++; }
    return n;
  }

  return (
    <div className="space-y-3">
      <button onClick={onNew} className="w-full bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPlus size={16} />บันทึกใหม่</button>
      {records.length === 0 ? <div className="text-center text-neutral-500 text-sm py-10">ยังไม่มีข้อมูล</div> : null}
      {records.map(function (r) {
        const issueCount = countIssue(r);
        return (
          <button key={r.id} onClick={function () { onSelect(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3.5 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
            <div className="min-w-0">
              <div className="font-medium text-neutral-200 text-sm truncate">{r.unitId || "-"} · {generatorFuelTypeLabel(r.fuelType, r.fuelTypeOther)} · {r.frequency || "quarterly"}</div>
              <div className="text-xs text-neutral-500 mt-0.5">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {issueCount > 0 ? <span className="text-xs bg-red-500/15 text-red-300 px-2 py-0.5 rounded-full border border-red-500/30">{issueCount} ปัญหา</span> : null}
              <button onClick={function (e) { handleDeleteClick(e, r.id); }} className="text-neutral-500 hover:text-red-400 p-1"><IconTrash size={16} /></button>
              <IconChevronRight size={18} className="text-amber-500/40" />
            </div>
          </button>
        );
      })}
    </div>
  );
}

function buildGeneratorReportHtml(record) {
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT HOTEL AND TOWER</div><div class=\"report-subtitle\">QUARTERLY GENERATOR INSPECTION & TESTING</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Unit ID:</b> " + escapeHtml(record.unitId) + "</div>");
  parts.push("<div><b>Make & Model:</b> " + escapeHtml(record.makeModel || "-") + "</div>");
  parts.push("<div><b>Rated Output:</b> " + escapeHtml((record.ratedOutputKva || "-") + " kVA / " + (record.ratedOutputKw || "-") + " kW") + "</div>");
  parts.push("<div><b>Voltage:</b> " + escapeHtml((record.voltageV || "-") + " V / " + (record.voltagePhase || "-") + " Phase / " + (record.voltageHz || "-") + " Hz") + "</div>");
  parts.push("<div><b>Fuel Type:</b> " + escapeHtml(generatorFuelTypeLabel(record.fuelType, record.fuelTypeOther)) + "</div>");
  parts.push("<div><b>Location:</b> " + escapeHtml(record.location || "-") + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("<div><b>Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(record.frequency || "-") + "</div>");
  const ovOpt = GENERATOR_STATUS_OPTIONS.filter(function (o) { return o.key === record.overallStatus; })[0];
  parts.push("<div><b>Overall Status:</b> " + escapeHtml(ovOpt ? (ovOpt.emoji + " " + ovOpt.label) : "-") + "</div>");
  parts.push("</div>");

  const statusMap = {};
  GENERATOR_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });

  GENERATOR_SECTIONS.forEach(function (sec) {
    if (sec.id === "opTest") {
      let opTable = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
      opTable += "<table class=\"checklist-table\"><thead><tr><th>Test Item</th><th>Result</th><th>Readings</th></tr></thead><tbody>";
      sec.items.forEach(function (item) {
        const v = (record.inspection && record.inspection[item.id]) || {};
        opTable += "<tr><td>" + escapeHtml(item.th) + "</td><td>" + escapeHtml(item.en) + "</td><td>" + escapeHtml(v.remark || "") + "</td></tr>";
      });
      opTable += "</tbody></table>";
      parts.push(opTable);
      return;
    }
    let table = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
    table += "<table class=\"checklist-table\"><thead><tr><th>Item</th><th>Status</th><th>Remark</th></tr></thead><tbody>";
    sec.items.forEach(function (item) {
      const v = (record.inspection && record.inspection[item.id]) || {};
      let label = "-"; let color = "#9ca3af";
      const opt = statusMap[v.status];
      if (opt) {
        label = opt.emoji + " " + opt.label;
        color = opt.color === "green" ? "#16a34a" : (opt.color === "red" ? "#dc2626" : "#d97706");
      }
      table += "<tr><td>" + escapeHtml(item.th) + " / " + escapeHtml(item.en) + "</td><td style=\"color:" + color + ";font-weight:600;\">" + label + "</td><td>" + escapeHtml(v.remark || "") + "</td></tr>";
    });
    table += "</tbody></table>";
    parts.push(table);
  });

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Inspector's Signature / ผู้ตรวจสอบ</div><div class=\"sig-name\">" + escapeHtml(record.inspector || "-") + "</div>");
  if (record.inspectorSignature) { parts.push("<img src=\"" + record.inspectorSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.inspectorSignDate || "") + "</div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Acknowledged by / ผู้รับทราบ</div><div class=\"sig-name\">" + escapeHtml(record.acknowledgedByName || "-") + (record.acknowledgedPosition ? (" (" + escapeHtml(record.acknowledgedPosition) + ")") : "") + "</div>");
  if (record.acknowledgedSignature) { parts.push("<img src=\"" + record.acknowledgedSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.acknowledgedSignDate || "") + "</div>");
  parts.push("</div>");

  return parts.join("");
}

function GeneratorReportView(props) {
  const record = props.record;
  const onEdit = props.onEdit;
  const onDelete = props.onDelete;
  const [popupBlocked, setPopupBlocked] = useState(false);

  if (!record) { return <div className="text-center text-neutral-500 py-10">ไม่พบข้อมูล</div>; }

  function handleExport() {
    const ok = openPrintWindow(buildGeneratorReportHtml(record), "Generator_" + (record.unitId || "") + "_" + (record.date || ""));
    setPopupBlocked(!ok);
  }
  function handleDeleteClick() {
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  const statusMap = {};
  GENERATOR_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });
  const ovOpt = statusMap[record.overallStatus];

  return (
    <div className="space-y-4 pb-6">
      <div className="flex gap-2">
        <button onClick={onEdit} className="flex-1 border border-neutral-700 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5 text-neutral-300"><IconEdit size={15} />แก้ไข</button>
        <button onClick={handleExport} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPrinter size={15} />พิมพ์ / Export</button>
        <button onClick={handleDeleteClick} className="border border-red-800/50 text-red-300 rounded-lg px-3 flex items-center justify-center"><IconTrash size={16} /></button>
      </div>
      {popupBlocked ? <div className="text-xs text-red-300 bg-red-950/40 border border-red-800/50 rounded-lg px-3 py-2">เบราว์เซอร์บล็อกหน้าต่างป๊อปอัป กรุณาอนุญาตป๊อปอัปสำหรับหน้านี้ แล้วกดพิมพ์ / Export อีกครั้ง</div> : null}

      <div className="bg-neutral-900 rounded-xl border border-neutral-800 border-t-2 border-t-amber-500/40 shadow-lg shadow-black/30 p-4">
        <div className="text-center mb-4">
          <div className="font-serif text-lg font-semibold text-amber-200">PRESIDENT HOTEL AND TOWER</div>
          <div className="text-xs text-neutral-500">QUARTERLY GENERATOR INSPECTION & TESTING</div>
        </div>
        <div className="grid grid-cols-2 gap-2 text-xs border-t border-b border-neutral-800 py-3 mb-3 text-neutral-300">
          <div><span className="text-neutral-500">Unit ID:</span> {record.unitId}</div>
          <div><span className="text-neutral-500">Make & Model:</span> {record.makeModel || "-"}</div>
          <div><span className="text-neutral-500">Rated Output:</span> {record.ratedOutputKva || "-"} kVA / {record.ratedOutputKw || "-"} kW</div>
          <div><span className="text-neutral-500">Voltage:</span> {record.voltageV || "-"} V / {record.voltagePhase || "-"} Phase / {record.voltageHz || "-"} Hz</div>
          <div><span className="text-neutral-500">Fuel Type:</span> {generatorFuelTypeLabel(record.fuelType, record.fuelTypeOther)}</div>
          <div><span className="text-neutral-500">Location:</span> {record.location || "-"}</div>
          <div><span className="text-neutral-500">Inspector:</span> {record.inspector || "-"}</div>
          <div><span className="text-neutral-500">Date:</span> {formatThaiDate(record.date)}</div>
          <div><span className="text-neutral-500">Frequency:</span> {record.frequency || "-"}</div>
          <div><span className="text-neutral-500">Overall Status:</span> {ovOpt ? (ovOpt.emoji + " " + ovOpt.label) : "-"}</div>
        </div>

        {GENERATOR_SECTIONS.map(function (sec) {
          if (sec.id === "opTest") {
            return (
              <div key={sec.id} className="mb-4">
                <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">{sec.icon} {sec.name}</div>
                <table className="w-full text-xs">
                  <thead>
                    <tr className="text-left text-amber-500/60 border-b border-neutral-800">
                      <th className="py-1">รายการทดสอบ</th><th className="py-1">ผลลัพธ์</th><th className="py-1">ค่าที่วัดได้</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sec.items.map(function (item) {
                      const v = (record.inspection && record.inspection[item.id]) || {};
                      return (
                        <tr key={item.id} className="border-b border-neutral-800/70">
                          <td className="py-1.5 text-neutral-300">{item.th}</td>
                          <td className="py-1.5 text-neutral-400">{item.en}</td>
                          <td className="py-1.5 text-amber-200">{v.remark || "-"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          }
          return (
            <div key={sec.id} className="mb-4">
              <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">{sec.icon} {sec.name}</div>
              <table className="w-full text-xs">
                <tbody>
                  {sec.items.map(function (item) {
                    const v = (record.inspection && record.inspection[item.id]) || {};
                    const opt = statusMap[v.status];
                    return (
                      <tr key={item.id} className="border-b border-neutral-800/70">
                        <td className="py-1.5 text-neutral-300">{item.th} <span className="text-neutral-500">/ {item.en}</span></td>
                        <td className="py-1.5 text-center w-32">
                          {opt ? (
                            <span className={opt.color === "green" ? "text-emerald-400 font-medium" : (opt.color === "red" ? "text-red-400 font-medium" : "text-amber-400 font-medium")}>
                              {opt.emoji} {opt.label}
                            </span>
                          ) : <span className="text-neutral-700">-</span>}
                        </td>
                        <td className="py-1.5 text-neutral-500">{v.remark || ""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })}

        <div className="pt-3 mt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Inspector's Signature / ผู้ตรวจสอบ</div>
          <div className="text-sm font-medium mb-2 text-amber-100">{record.inspector || "-"}</div>
          {record.inspectorSignature ? <img src={record.inspectorSignature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
          <div className="text-xs text-neutral-500 mt-1">Date: {formatThaiDate(record.inspectorSignDate)}</div>
        </div>
        <div className="pt-3 mt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Acknowledged by / ผู้รับทราบ</div>
          <div className="text-sm font-medium mb-2 text-amber-100">{record.acknowledgedByName || "-"}{record.acknowledgedPosition ? (" (" + record.acknowledgedPosition + ")") : ""}</div>
          {record.acknowledgedSignature ? <img src={record.acknowledgedSignature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
          <div className="text-xs text-neutral-500 mt-1">Date: {formatThaiDate(record.acknowledgedSignDate)}</div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Rental Office M&E System Inspection Checklist ---------- */
function RentalOfficeHomeView(props) {

  const recent = props.recent;
  const onNew = props.onNew;
  const onHistory = props.onHistory;

    <div className="space-y-4">
      <div className="bg-neutral-900 rounded-xl border border-neutral-800 border-t-2 border-t-amber-500/40 shadow-lg shadow-black/30 p-4">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-300 flex items-center justify-center"><IconBuilding size={20} /></div>
          <div>
            <div className="font-serif font-semibold text-amber-100">Rental Office M&E System Inspection Checklist</div>

          </div>

      <div className="grid grid-cols-2 gap-3">

          <IconPlus size={20} /><span className="text-sm">บันทึกใหม่</span>
        </button>
        <button onClick={onHistory} className="bg-neutral-900 border border-amber-500/25 rounded-xl py-4 flex flex-col items-center justify-center gap-1.5 text-amber-200">
          <IconHistory size={20} /><span className="text-sm font-medium">ดูประวัติทั้งหมด</span>
        </button>

        <div>
          <div className="text-[11px] uppercase tracking-wide text-amber-500/60 mb-2 px-1">รายการล่าสุด</div>

              return (
                <button key={r.id} onClick={function () { onOpenReport(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-neutral-200 truncate">{r.buildingName || "-"} · Floor {r.floor || "-"} · Room {r.roomNo || "-"}</div>

function RentalOfficeFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [buildingName, setBuildingName] = useState(record ? record.buildingName : "");
  const [floor, setFloor] = useState(record ? record.floor : "");
  const [roomNo, setRoomNo] = useState(record ? record.roomNo : "");
  const [areaSqm, setAreaSqm] = useState(record ? record.areaSqm : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [roundNo, setRoundNo] = useState(record ? record.roundNo : "");
  const [frequency, setFrequency] = useState(record ? record.frequency : RENTAL_OFFICE_FREQUENCIES[0].key);
  const [quarter, setQuarter] = useState(record ? record.quarter : "");
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [inspection, setInspection] = useState(record && record.inspection ? record.inspection : {});
  const [inspectorSignature, setInspectorSignature] = useState(record ? record.inspectorSignature : "");
  const [inspectorSignDate, setInspectorSignDate] = useState(record ? record.inspectorSignDate : todayISO());
  const [managerSignature, setManagerSignature] = useState(record ? record.managerSignature : "");
  const [managerSignDate, setManagerSignDate] = useState(record ? record.managerSignDate : todayISO());
  const [criticalCount, setCriticalCount] = useState(record ? record.criticalCount : "");
  const [error, setError] = useState("");

  function setItemStatus(id, status) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: cur.qty || "", status: cur.status === status ? null : status, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemQty(id, qty) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: qty, status: cur.status || null, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemRemark(id, remark) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: cur.qty || "", status: cur.status || null, remark: remark || "" };
      return next;
    });
  }

  function handleSave() {
    if (!buildingName || !date) {
      setError("กรุณากรอกชื่ออาคาร และวันที่ตรวจสอบ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      buildingName: buildingName, floor: floor, roomNo: roomNo, areaSqm: areaSqm,
      date: date, roundNo: roundNo, frequency: frequency, quarter: quarter, inspector: inspector,
      inspection: inspection,
      inspectorSignature: inspectorSignature, inspectorSignDate: inspectorSignDate,
      managerSignature: managerSignature, managerSignDate: managerSignDate,
      criticalCount: criticalCount
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  const summary = rentalOfficeSummary({ inspection: inspection });

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป / General Information">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div className="sm:col-span-2">
            <Field label="Building Name / ชื่ออาคาร"><input value={buildingName} onChange={function (e) { setBuildingName(e.target.value); }} className={inputCls} placeholder="เช่น President Tower" /></Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Office Unit / ห้อง/ยูนิตสำนักงาน">
              <div className="grid grid-cols-3 gap-2">
                <input value={floor} onChange={function (e) { setFloor(e.target.value); }} className={inputCls} placeholder="ชั้น" />
                <input value={roomNo} onChange={function (e) { setRoomNo(e.target.value); }} className={inputCls} placeholder="ห้องเลขที่" />
                <input value={areaSqm} onChange={function (e) { setAreaSqm(e.target.value); }} className={inputCls} inputMode="decimal" placeholder="พื้นที่ (ตร.ม.)" />
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Inspection Date / วันที่ตรวจสอบ (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          </div>
          <Field label="Inspection Round / ครั้งที่ตรวจสอบ"><input value={roundNo} onChange={function (e) { setRoundNo(e.target.value); }} className={inputCls} placeholder="เช่น 1" /></Field>
          <div className="sm:col-span-2">
            <Field label="Frequency / ความถี่ตรวจสอบ">
              <div className="flex flex-wrap gap-1.5">
                {RENTAL_OFFICE_FREQUENCIES.map(function (f) {
                  const active = frequency === f.key;
                  return (
                    <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {f.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Quarter / ไตรมาส">
              <div className="flex flex-wrap gap-1.5">
                {RENTAL_OFFICE_QUARTERS.map(function (q) {
                  const active = quarter === q.key;
                  return (
                    <button key={q.key} type="button" onClick={function () { setQuarter(quarter === q.key ? "" : q.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {q.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Inspector / ผู้ตรวจสอบ"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          </div>
        </div>
      </Section>

      <div className="text-[11px] text-neutral-500 px-2 flex flex-wrap gap-3">
        {RENTAL_OFFICE_STATUS_OPTIONS.map(function (o) {
          return <span key={o.key}>{o.emoji} {o.label}</span>;
        })}
      </div>

      {RENTAL_OFFICE_SECTIONS.map(function (sec) {
        return (
          <Section key={sec.id} title={sec.icon + " " + sec.name}>
            <div className="space-y-2">
              {sec.items.map(function (item) {
                const cur = inspection[item.id] || {};
                const st = cur.status;
                return (
                  <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                    <div className="text-sm text-neutral-300 mb-1">{item.th} <span className="text-neutral-500">/ {item.en}</span></div>
                    <div className="text-[11px] text-neutral-600 mb-2">Standard/Remark: {item.standard}</div>
                    <div className="flex items-center gap-2 mb-2">
                      <label className="text-[11px] text-neutral-500 shrink-0">จำนวนรวม / Qty</label>
                      <input value={cur.qty || ""} onChange={function (e) { setItemQty(item.id, e.target.value); }} className="w-24 text-xs border border-neutral-700 rounded px-2 py-1 bg-neutral-900 text-neutral-200" />
                    </div>
                    <div className="flex gap-1.5">
                      {RENTAL_OFFICE_STATUS_OPTIONS.map(function (o) {
                        return (
                          <EquipStatusBtn key={o.key} active={st === o.key} opt={o}
                            onClick={function () { setItemStatus(item.id, o.key); }} />
                        );
                      })}
                    </div>
                    <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder="หมายเหตุ" className="mt-2 w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                  </div>
                );
              })}
            </div>
          </Section>
        );
      })}

      <Section title="สรุปผลการตรวจสอบ / Inspection Summary">
        <div className="grid grid-cols-2 gap-2 text-sm">
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">จำนวนรายการตรวจสอบทั้งหมด</span><span className="text-neutral-200 font-medium">{summary.total}</span></div>
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">รายการปกติ</span><span className="text-emerald-400 font-medium">{summary.normal}</span></div>
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">รายการต้องซ่อมบำรุง</span><span className="text-amber-400 font-medium">{summary.damaged}</span></div>
          <div className="flex justify-between items-center border-b border-neutral-800 py-1.5">
            <span className="text-neutral-500">รายการวิกฤตต้องแก้ไขทันที</span>
            <input value={criticalCount} onChange={function (e) { setCriticalCount(e.target.value.replace(/[^0-9]/g, "").slice(0, 1)); }}
              inputMode="numeric" maxLength={1} placeholder="0"
              className="w-12 text-center text-sm border border-neutral-700 rounded px-1 py-1 bg-neutral-900 text-red-400 font-medium" />
          </div>
        </div>
      </Section>

      <Section title="ลงชื่อผู้ตรวจสอบ / Inspector's Signature">
        <SignaturePad value={inspectorSignature} onChange={setInspectorSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={inspectorSignDate} onChange={setInspectorSignDate} /></Field>
        </div>
      </Section>

      <Section title="ลงชื่อผู้จัดการร้าน / Shop Manager's Signature">
        <SignaturePad value={managerSignature} onChange={setManagerSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={managerSignDate} onChange={setManagerSignDate} /></Field>
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (
        <button onClick={handleDelete} className="w-full border border-red-800/50 text-red-300 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5"><IconTrash size={15} />ลบรายการนี้</button>
      ) : null}
    </div>
  );
}

function RentalOfficeListView(props) {
  const records = props.records;
  const onSelect = props.onSelect;
  const onNew = props.onNew;
  const onDelete = props.onDelete;

  function handleDeleteClick(e, id) {
    e.stopPropagation();
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(id);
    }
  }
  function countIssue(r) {
    const s = rentalOfficeSummary(r);
    return s.damaged;
  }

  return (
    <div className="space-y-3">
      <button onClick={onNew} className="w-full bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPlus size={16} />บันทึกใหม่</button>
      {records.length === 0 ? <div className="text-center text-neutral-500 text-sm py-10">ยังไม่มีข้อมูล</div> : null}
      {records.map(function (r) {
        const issueCount = countIssue(r);
        return (
          <button key={r.id} onClick={function () { onSelect(r.id); }} className="w-full bg-neutral-900 rounded-xl border border-neutral-800 p-3.5 text-left flex items-center justify-between gap-2 hover:border-amber-500/30 transition">
            <div className="min-w-0">
              <div className="font-medium text-neutral-200 text-sm truncate">{r.buildingName || "-"} · Floor {r.floor || "-"} · Room {r.roomNo || "-"}</div>
              <div className="text-xs text-neutral-500 mt-0.5">{formatThaiDate(r.date)} ผู้ตรวจ: {r.inspector || "-"}</div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {issueCount > 0 ? <span className="text-xs bg-red-500/15 text-red-300 px-2 py-0.5 rounded-full border border-red-500/30">{issueCount} ปัญหา</span> : null}
              <button onClick={function (e) { handleDeleteClick(e, r.id); }} className="text-neutral-500 hover:text-red-400 p-1"><IconTrash size={16} /></button>
              <IconChevronRight size={18} className="text-amber-500/40" />
            </div>
          </button>
        );
      })}
    </div>
  );
}

function buildRentalOfficeReportHtml(record) {
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT HOTEL AND TOWER</div><div class=\"report-subtitle\">RENTAL OFFICE M&amp;E SYSTEM INSPECTION CHECKLIST</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Building Name:</b> " + escapeHtml(record.buildingName) + "</div>");
  parts.push("<div><b>Office Unit:</b> Floor " + escapeHtml(record.floor || "-") + " / Room " + escapeHtml(record.roomNo || "-") + " (" + escapeHtml(record.areaSqm || "-") + " sq.m.)</div>");
  parts.push("<div><b>Inspection Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Round No.:</b> " + escapeHtml(record.roundNo || "-") + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(rentalOfficeFrequencyLabel(record.frequency)) + "</div>");
  parts.push("<div><b>Quarter:</b> " + escapeHtml((record.quarter || "-").toUpperCase()) + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("</div>");

  const statusMap = {};
  RENTAL_OFFICE_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });

  RENTAL_OFFICE_SECTIONS.forEach(function (sec) {
    let table = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
    table += "<table class=\"checklist-table\"><thead><tr><th>Item</th><th>Qty</th><th>Status</th><th>Standard / Remark</th></tr></thead><tbody>";
    sec.items.forEach(function (item) {
      const v = (record.inspection && record.inspection[item.id]) || {};
      let label = "-"; let color = "#9ca3af";
      const opt = statusMap[v.status];
      if (opt) {
        label = opt.emoji + " " + opt.label;
        color = opt.color === "green" ? "#16a34a" : (opt.color === "red" ? "#dc2626" : "#d97706");
      }
      const remarkText = (item.standard || "") + (v.remark ? (" — " + v.remark) : "");
      table += "<tr><td>" + escapeHtml(item.th) + " / " + escapeHtml(item.en) + "</td><td>" + escapeHtml(v.qty || "-") + "</td><td style=\"color:" + color + ";font-weight:600;\">" + label + "</td><td>" + escapeHtml(remarkText) + "</td></tr>";
    });
    table += "</tbody></table>";
    parts.push(table);
  });

  const summary = rentalOfficeSummary(record);
  parts.push("<div class=\"op-data-title\">สรุปผลการตรวจสอบ / Inspection Summary</div>");
  parts.push("<div class=\"op-grid\">");
  parts.push("<div><span>Total Items Checked</span><span>" + summary.total + "</span></div>");
  parts.push("<div><span>Passed / Normal</span><span>" + summary.normal + "</span></div>");
  parts.push("<div><span>Need Maintenance</span><span>" + summary.damaged + "</span></div>");
  parts.push("<div><span>Critical / Immediate Fix</span><span>" + escapeHtml(record.criticalCount || "-") + "</span></div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Inspector's Signature / ผู้ตรวจสอบ</div><div class=\"sig-name\">" + escapeHtml(record.inspector || "-") + "</div>");
  if (record.inspectorSignature) { parts.push("<img src=\"" + record.inspectorSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.inspectorSignDate || "") + "</div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Shop Manager's Signature / ผู้จัดการร้าน</div><div class=\"sig-name\">&nbsp;</div>");
  if (record.managerSignature) { parts.push("<img src=\"" + record.managerSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.managerSignDate || "") + "</div>");
  parts.push("</div>");

  return parts.join("");
}

function RentalOfficeReportView(props) {
  const record = props.record;
  const onEdit = props.onEdit;
  const onDelete = props.onDelete;
  const [popupBlocked, setPopupBlocked] = useState(false);

  if (!record) { return <div className="text-center text-neutral-500 py-10">ไม่พบข้อมูล</div>; }

  function handleExport() {
    const ok = openPrintWindow(buildRentalOfficeReportHtml(record), "RentalOffice_" + (record.buildingName || "") + "_" + (record.date || ""));
    setPopupBlocked(!ok);
  }
  function handleDeleteClick() {
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  const statusMap = {};
  RENTAL_OFFICE_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });
  const summary = rentalOfficeSummary(record);

  return (
    <div className="space-y-4 pb-6">
      <div className="flex gap-2">
        <button onClick={onEdit} className="flex-1 border border-neutral-700 rounded-lg py-2 text-sm font-medium flex items-center justify-center gap-1.5 text-neutral-300"><IconEdit size={15} />แก้ไข</button>
        <button onClick={handleExport} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2 text-sm font-semibold flex items-center justify-center gap-1.5"><IconPrinter size={15} />พิมพ์ / Export</button>
        <button onClick={handleDeleteClick} className="border border-red-800/50 text-red-300 rounded-lg px-3 flex items-center justify-center"><IconTrash size={16} /></button>
      </div>
      {popupBlocked ? <div className="text-xs text-red-300 bg-red-950/40 border border-red-800/50 rounded-lg px-3 py-2">เบราว์เซอร์บล็อกหน้าต่างป๊อปอัป กรุณาอนุญาตป๊อปอัปสำหรับหน้านี้ แล้วกดพิมพ์ / Export อีกครั้ง</div> : null}

      <div className="bg-neutral-900 rounded-xl border border-neutral-800 border-t-2 border-t-amber-500/40 shadow-lg shadow-black/30 p-4">
        <div className="text-center mb-4">
          <div className="font-serif text-lg font-semibold text-amber-200">PRESIDENT HOTEL AND TOWER</div>
          <div className="text-xs text-neutral-500">RENTAL OFFICE M&amp;E SYSTEM INSPECTION CHECKLIST</div>
        </div>
        <div className="grid grid-cols-2 gap-2 text-xs border-t border-b border-neutral-800 py-3 mb-3 text-neutral-300">
          <div><span className="text-neutral-500">Building:</span> {record.buildingName}</div>
          <div><span className="text-neutral-500">Unit:</span> Floor {record.floor || "-"} / Room {record.roomNo || "-"}</div>
          <div><span className="text-neutral-500">Area:</span> {record.areaSqm || "-"} ตร.ม.</div>
          <div><span className="text-neutral-500">Date:</span> {formatThaiDate(record.date)}</div>
          <div><span className="text-neutral-500">Round No.:</span> {record.roundNo || "-"}</div>
          <div><span className="text-neutral-500">Frequency:</span> {rentalOfficeFrequencyLabel(record.frequency)}</div>
          <div><span className="text-neutral-500">Quarter:</span> {(record.quarter || "-").toUpperCase()}</div>
          <div><span className="text-neutral-500">Inspector:</span> {record.inspector || "-"}</div>
        </div>

        {RENTAL_OFFICE_SECTIONS.map(function (sec) {
          return (
            <div key={sec.id} className="mb-4">
              <div className="font-serif text-amber-300 uppercase tracking-wider text-xs mb-2">{sec.icon} {sec.name}</div>
              <table className="w-full text-xs">
                <tbody>
                  {sec.items.map(function (item) {
                    const v = (record.inspection && record.inspection[item.id]) || {};
                    const opt = statusMap[v.status];
                    return (
                      <tr key={item.id} className="border-b border-neutral-800/70">
                        <td className="py-1.5 text-neutral-300">{item.th} <span className="text-neutral-500">/ {item.en}</span><div className="text-[10px] text-neutral-600">{item.standard}</div></td>
                        <td className="py-1.5 text-center w-16 text-neutral-400">{v.qty || "-"}</td>
                        <td className="py-1.5 text-center w-32">
                          {opt ? (
                            <span className={opt.color === "green" ? "text-emerald-400 font-medium" : (opt.color === "red" ? "text-red-400 font-medium" : "text-amber-400 font-medium")}>
                              {opt.emoji} {opt.label}
                            </span>
                          ) : <span className="text-neutral-700">-</span>}
                        </td>
                        <td className="py-1.5 text-neutral-500">{v.remark || ""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })}

        <div className="pt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">สรุปผลการตรวจสอบ / Inspection Summary</div>
          <div className="grid grid-cols-2 gap-2 text-xs text-neutral-300">
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Total Items Checked</span><span>{summary.total}</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Passed / Normal</span><span className="text-emerald-400">{summary.normal}</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Need Maintenance</span><span className="text-amber-400">{summary.damaged}</span></div>
            <div className="flex justify-between border-b border-neutral-800/70 py-1"><span className="text-neutral-500">Critical / Immediate Fix</span><span className="text-red-400">{record.criticalCount || "-"}</span></div>
          </div>
        </div>

        <div className="pt-3 mt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Inspector's Signature / ผู้ตรวจสอบ</div>
          <div className="text-sm font-medium mb-2 text-amber-100">{record.inspector || "-"}</div>
          {record.inspectorSignature ? <img src={record.inspectorSignature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
          <div className="text-xs text-neutral-500 mt-1">Date: {formatThaiDate(record.inspectorSignDate)}</div>
        </div>

        <div className="pt-3 mt-3 border-t border-neutral-800">
          <div className="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">Shop Manager's Signature / ผู้จัดการร้าน</div>
          {record.managerSignature ? <img src={record.managerSignature} alt="signature" className="h-16 rounded bg-white p-1" /> : <div className="text-xs text-neutral-600">ยังไม่มีลายเซ็น</div>}
          <div className="text-xs text-neutral-500 mt-1">Date: {formatThaiDate(record.managerSignDate)}</div>
        </div>
      </div>
    </div>
  );
}

function ShopHomeView(props) {

  const recent = props.recent;
  const onNew = props.onNew;
  const onHistory = props.onHistory;
  const onOpenReport = props.onOpenReport;

    <div className="space-y-4">

        <div className="flex items-center gap-3">

      <div className="grid grid-cols-2 gap-3">

                  <div className="min-w-0">
                    <div className="text-sm font-medium text-neutral-200 truncate">{r.buildingName || "-"} · Floor {r.floor || "-"} · Room {r.roomNo || "-"}</div>

function ShopFormView(props) {
  const record = props.record;
  const onSave = props.onSave;
  const onCancel = props.onCancel;
  const onDelete = props.onDelete;

  const [recordId] = useState(function () { return record ? record.id : (Date.now().toString()); });
  const [buildingName, setBuildingName] = useState(record ? record.buildingName : "");
  const [floor, setFloor] = useState(record ? record.floor : "");
  const [roomNo, setRoomNo] = useState(record ? record.roomNo : "");
  const [areaSqm, setAreaSqm] = useState(record ? record.areaSqm : "");
  const [date, setDate] = useState(record ? record.date : todayISO());
  const [roundNo, setRoundNo] = useState(record ? record.roundNo : "");
  const [frequency, setFrequency] = useState(record ? record.frequency : SHOP_FREQUENCIES[0].key);
  const [quarter, setQuarter] = useState(record ? record.quarter : "");
  const [inspector, setInspector] = useState(record ? record.inspector : "");
  const [inspection, setInspection] = useState(record && record.inspection ? record.inspection : {});
  const [inspectorSignature, setInspectorSignature] = useState(record ? record.inspectorSignature : "");
  const [inspectorSignDate, setInspectorSignDate] = useState(record ? record.inspectorSignDate : todayISO());
  const [managerSignature, setManagerSignature] = useState(record ? record.managerSignature : "");
  const [managerSignDate, setManagerSignDate] = useState(record ? record.managerSignDate : todayISO());
  const [criticalCount, setCriticalCount] = useState(record ? record.criticalCount : "");
  const [error, setError] = useState("");

  function setItemStatus(id, status) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: cur.qty || "", status: cur.status === status ? null : status, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemQty(id, qty) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: qty, status: cur.status || null, remark: cur.remark || "" };
      return next;
    });
  }
  function setItemRemark(id, remark) {
    setInspection(function (c) {
      const cur = c[id] || {};
      const next = {};
      for (const k in c) next[k] = c[k];
      next[id] = { qty: cur.qty || "", status: cur.status || null, remark: remark || "" };
      return next;
    });
  }

  function handleSave() {
    if (!buildingName || !date) {
      setError("กรุณากรอกชื่ออาคาร และวันที่ตรวจสอบ ให้ครบ");
      return;
    }
    setError("");
    onSave({
      id: recordId,
      buildingName: buildingName, floor: floor, roomNo: roomNo, areaSqm: areaSqm,
      date: date, roundNo: roundNo, frequency: frequency, quarter: quarter, inspector: inspector,
      inspection: inspection,
      inspectorSignature: inspectorSignature, inspectorSignDate: inspectorSignDate,
      managerSignature: managerSignature, managerSignDate: managerSignDate,
      criticalCount: criticalCount
    });
  }

  function handleDelete() {
    if (!record) return;
    if (window.confirm("ต้องการลบรายการนี้ใช่หรือไม่? ลบแล้วกู้คืนไม่ได้")) {
      onDelete(record.id);
    }
  }

  const summary = shopSummary({ inspection: inspection });

  return (
    <div className="space-y-4 pb-6">
      {error ? <div className="bg-red-950/40 text-red-300 text-sm rounded-lg px-3 py-2 border border-red-800/50">{error}</div> : null}

      <Section title="ข้อมูลทั่วไป / General Information">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div className="sm:col-span-2">
            <Field label="Building Name / ชื่ออาคาร"><input value={buildingName} onChange={function (e) { setBuildingName(e.target.value); }} className={inputCls} placeholder="เช่น President Tower" /></Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Office Unit / ห้อง/ยูนิตสำนักงาน">
              <div className="grid grid-cols-3 gap-2">
                <input value={floor} onChange={function (e) { setFloor(e.target.value); }} className={inputCls} placeholder="ชั้น" />
                <input value={roomNo} onChange={function (e) { setRoomNo(e.target.value); }} className={inputCls} placeholder="ห้องเลขที่" />
                <input value={areaSqm} onChange={function (e) { setAreaSqm(e.target.value); }} className={inputCls} inputMode="decimal" placeholder="พื้นที่ (ตร.ม.)" />
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Inspection Date / วันที่ตรวจสอบ (dd/mm/yyyy)"><DateField value={date} onChange={setDate} /></Field>
          </div>
          <Field label="Inspection Round / ครั้งที่ตรวจสอบ"><input value={roundNo} onChange={function (e) { setRoundNo(e.target.value); }} className={inputCls} placeholder="เช่น 1" /></Field>
          <div className="sm:col-span-2">
            <Field label="Frequency / ความถี่ตรวจสอบ">
              <div className="flex flex-wrap gap-1.5">
                {SHOP_FREQUENCIES.map(function (f) {
                  const active = frequency === f.key;
                  return (
                    <button key={f.key} type="button" onClick={function () { setFrequency(f.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {f.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Quarter / ไตรมาส">
              <div className="flex flex-wrap gap-1.5">
                {SHOP_QUARTERS.map(function (q) {
                  const active = quarter === q.key;
                  return (
                    <button key={q.key} type="button" onClick={function () { setQuarter(quarter === q.key ? "" : q.key); }}
                      className={"px-3 py-1.5 rounded-lg text-xs font-medium border " + (active ? "bg-amber-500/20 border-amber-500/60 text-amber-300" : "bg-neutral-900 border-neutral-700 text-neutral-400")}>
                      {q.label}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
          <div className="sm:col-span-2">
            <Field label="Inspector / ผู้ตรวจสอบ"><input value={inspector} onChange={function (e) { setInspector(e.target.value); }} className={inputCls} /></Field>
          </div>
        </div>
      </Section>

      <div className="text-[11px] text-neutral-500 px-2 flex flex-wrap gap-3">
        {SHOP_STATUS_OPTIONS.map(function (o) {
          return <span key={o.key}>{o.emoji} {o.label}</span>;
        })}
      </div>

      {SHOP_SECTIONS.map(function (sec) {
        return (
          <Section key={sec.id} title={sec.icon + " " + sec.name}>
            <div className="space-y-2">
              {sec.items.map(function (item) {
                const cur = inspection[item.id] || {};
                const st = cur.status;
                return (
                  <div key={item.id} className="border border-neutral-800 rounded-lg p-2.5 bg-neutral-950/40">
                    <div className="text-sm text-neutral-300 mb-1">{item.th} <span className="text-neutral-500">/ {item.en}</span></div>
                    <div className="text-[11px] text-neutral-600 mb-2">Standard/Remark: {item.standard}</div>
                    <div className="flex items-center gap-2 mb-2">
                      <label className="text-[11px] text-neutral-500 shrink-0">จำนวนรวม / Qty</label>
                      <input value={cur.qty || ""} onChange={function (e) { setItemQty(item.id, e.target.value); }} className="w-24 text-xs border border-neutral-700 rounded px-2 py-1 bg-neutral-900 text-neutral-200" />
                    </div>
                    <div className="flex gap-1.5">
                      {SHOP_STATUS_OPTIONS.map(function (o) {
                        return (
                          <EquipStatusBtn key={o.key} active={st === o.key} opt={o}
                            onClick={function () { setItemStatus(item.id, o.key); }} />
                        );
                      })}
                    </div>
                    <input value={cur.remark || ""} onChange={function (e) { setItemRemark(item.id, e.target.value); }} placeholder="หมายเหตุ" className="mt-2 w-full text-xs border border-neutral-800 rounded px-2 py-1.5 bg-neutral-900 text-neutral-300 placeholder-neutral-600" />
                  </div>
                );
              })}
            </div>
          </Section>
        );
      })}

      <Section title="สรุปผลการตรวจสอบ / Inspection Summary">
        <div className="grid grid-cols-2 gap-2 text-sm">
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">จำนวนรายการตรวจสอบทั้งหมด</span><span className="text-neutral-200 font-medium">{summary.total}</span></div>
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">รายการปกติ</span><span className="text-emerald-400 font-medium">{summary.normal}</span></div>
          <div className="flex justify-between border-b border-neutral-800 py-1.5"><span className="text-neutral-500">รายการต้องซ่อมบำรุง</span><span className="text-amber-400 font-medium">{summary.damaged}</span></div>
          <div className="flex justify-between items-center border-b border-neutral-800 py-1.5">
            <span className="text-neutral-500">รายการวิกฤตต้องแก้ไขทันที</span>
            <input value={criticalCount} onChange={function (e) { setCriticalCount(e.target.value.replace(/[^0-9]/g, "").slice(0, 1)); }}
              inputMode="numeric" maxLength={1} placeholder="0"
              className="w-12 text-center text-sm border border-neutral-700 rounded px-1 py-1 bg-neutral-900 text-red-400 font-medium" />
          </div>
        </div>
      </Section>


      <Section title="ลงชื่อผู้ตรวจสอบ / Inspector's Signature">
        <SignaturePad value={inspectorSignature} onChange={setInspectorSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={inspectorSignDate} onChange={setInspectorSignDate} /></Field>
        </div>
      </Section>

      <Section title="ลงชื่อผู้จัดการร้าน / Shop Manager's Signature">
        <SignaturePad value={managerSignature} onChange={setManagerSignature} />
        <div className="mt-3">
          <Field label="วันที่ (dd/mm/yyyy)"><DateField value={managerSignDate} onChange={setManagerSignDate} /></Field>
        </div>
      </Section>

      <div className="flex gap-2 pt-2">
        <button onClick={onCancel} className="flex-1 border border-neutral-700 rounded-lg py-2.5 text-sm font-medium text-neutral-300">ยกเลิก</button>
        <button onClick={handleSave} className="flex-1 bg-gradient-to-r from-amber-400 to-amber-600 text-black rounded-lg py-2.5 text-sm font-semibold flex items-center justify-center gap-1.5"><IconSave size={16} />บันทึก</button>
      </div>
      {record ? (

function ShopListView(props) {
  const records = props.records;

  }

    <div className="space-y-3">

              <IconChevronRight size={18} className="text-amber-500/40" />

function buildShopReportHtml(record) {
  const parts = [];
  parts.push("<div class=\"report-header\"><img src=\"logo.png\" class=\"report-logo\" onerror=\"this.style.display='none'\" /><div class=\"report-title\">PRESIDENT HOTEL AND TOWER</div><div class=\"report-subtitle\">SHOP EQUIPMENT &amp; SAFETY INSPECTION CHECKLIST</div></div>");
  parts.push("<div class=\"info-grid\">");
  parts.push("<div><b>Building Name:</b> " + escapeHtml(record.buildingName) + "</div>");
  parts.push("<div><b>Office Unit:</b> Floor " + escapeHtml(record.floor || "-") + " / Room " + escapeHtml(record.roomNo || "-") + " (" + escapeHtml(record.areaSqm || "-") + " sq.m.)</div>");
  parts.push("<div><b>Inspection Date:</b> " + formatThaiDate(record.date) + "</div>");
  parts.push("<div><b>Round No.:</b> " + escapeHtml(record.roundNo || "-") + "</div>");
  parts.push("<div><b>Frequency:</b> " + escapeHtml(shopFrequencyLabel(record.frequency)) + "</div>");
  parts.push("<div><b>Quarter:</b> " + escapeHtml((record.quarter || "-").toUpperCase()) + "</div>");
  parts.push("<div><b>Inspector:</b> " + escapeHtml(record.inspector || "-") + "</div>");
  parts.push("</div>");

  const statusMap = {};
  SHOP_STATUS_OPTIONS.forEach(function (o) { statusMap[o.key] = o; });

  SHOP_SECTIONS.forEach(function (sec) {
    let table = "<div class=\"op-data-title\">" + sec.icon + " " + escapeHtml(sec.name) + "</div>";
    table += "<table class=\"checklist-table\"><thead><tr><th>Item</th><th>Qty</th><th>Status</th><th>Standard / Remark</th></tr></thead><tbody>";
    sec.items.forEach(function (item) {
      const v = (record.inspection && record.inspection[item.id]) || {};
      let label = "-"; let color = "#9ca3af";
      const opt = statusMap[v.status];
      if (opt) {
        label = opt.emoji + " " + opt.label;
        color = opt.color === "green" ? "#16a34a" : (opt.color === "red" ? "#dc2626" : "#d97706");
      }
      const remarkText = (item.standard || "") + (v.remark ? (" — " + v.remark) : "");
      table += "<tr><td>" + escapeHtml(item.th) + " / " + escapeHtml(item.en) + "</td><td>" + escapeHtml(v.qty || "-") + "</td><td style=\"color:" + color + ";font-weight:600;\">" + label + "</td><td>" + escapeHtml(remarkText) + "</td></tr>";
    });
    table += "</tbody></table>";
    parts.push(table);
  });

  const summary = shopSummary(record);
  parts.push("<div class=\"op-data-title\">สรุปผลการตรวจสอบ / Inspection Summary</div>");
  parts.push("<div class=\"op-grid\">");
  parts.push("<div><span>Total Items Checked</span><span>" + summary.total + "</span></div>");
  parts.push("<div><span>Passed / Normal</span><span>" + summary.normal + "</span></div>");
  parts.push("<div><span>Need Maintenance</span><span>" + summary.damaged + "</span></div>");
  parts.push("<div><span>Critical / Immediate Fix</span><span>" + escapeHtml(record.criticalCount || "-") + "</span></div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Inspector's Signature / ผู้ตรวจสอบ</div><div class=\"sig-name\">" + escapeHtml(record.inspector || "-") + "</div>");
  if (record.inspectorSignature) { parts.push("<img src=\"" + record.inspectorSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.inspectorSignDate || "") + "</div>");
  parts.push("</div>");

  parts.push("<div class=\"signature-block\"><div class=\"sig-label\">Shop Manager's Signature / ผู้จัดการร้าน</div><div class=\"sig-name\">&nbsp;</div>");
  if (record.managerSignature) { parts.push("<img src=\"" + record.managerSignature + "\" class=\"sig-img\" />"); }
  else { parts.push("<div class=\"sig-empty\">No signature</div>"); }
  parts.push("<div class=\"sig-date\">Date: " + formatThaiDate(record.managerSignDate || "") + "</div>");
  parts.push("</div>");

  return parts.join("");
}

  });
  const [darkMode, setDarkMode] = useState(function(){
    return localStorage.getItem("theme") !== "light";
  });

  useEffect(function(){
    document.documentElement.classList.toggle("light", !darkMode);
    localStorage.setItem("theme", darkMode ? "dark" : "light");
  }, [darkMode]);

  useEffect(function () {
    function onStatusChange() { setNotifStatus(window.pmNotifState.status); }
    function onForeground(e) { showToast("🔔 " + e.detail); }
    window.addEventListener("pmNotifStatusChanged", onStatusChange);
    window.addEventListener("pmNotifForeground", onForeground);
    return function () {
      window.removeEventListener("pmNotifStatusChanged", onStatusChange);
      window.removeEventListener("pmNotifForeground", onForeground);
    };
  }, []);

  function enableNotifications() {
    if (!window.pmEnableNotifications) { showToast("ระบบแจ้งเตือนยังไม่พร้อม"); return; }

      .then(function () { showToast("เปิดการแจ้งเตือนเรียบร้อย"); })
      .catch(function (err) { showToast(err && err.message ? err.message : "เปิดการแจ้งเตือนไม่สำเร็จ"); });
  }

  function toggleTheme(){ setDarkMode(function(d){ return !d; }); }

  const poolRecords = {};

    if (!record.id) { record.id = Date.now().toString(); }
    if (!record.createdAt) { record.createdAt = new Date().toISOString(); }
    if (window.fbDb) {
      window.fbDb.collection("scheduleRecords").doc(record.id).set(record)
        .then(function () { showToast("บันทึกข้อมูลเรียบร้อย"); })
        .catch(function () { showToast("บันทึกไม่สำเร็จ ลองอีกครั้ง"); });
    }
    setStack(["home", "scheduleHome", "scheduleList"]);
  }

  function importScheduleRecords(fileName, records, onDone) {
    var saved = 0;
    var total = records.length;
    records.forEach(function(record) {
      if (!record.id) record.id = Date.now().toString() + "_" + Math.random().toString(36).slice(2, 6);
      if (!record.createdAt) record.createdAt = new Date().toISOString();
      if (window.fbDb) {
        window.fbDb.collection("scheduleRecords").doc(record.id).set(record)
          .then(function() { saved++; if (saved === total && onDone) onDone(saved); })
          .catch(function() { saved++; if (saved === total && onDone) onDone(saved); });
      } else {
        saved++;
        if (saved === total && onDone) onDone(saved);
      }
    });
    /* เพิ่มไฟล์ใน importedFiles state */
    setImportedFiles(function(prev) {
      return prev.concat([{
        id: Date.now().toString(),
        fileName: fileName,
        importedAt: new Date().toISOString(),
        count: total,
        records: records
      }]);
    });
    if (total === 0 && onDone) onDone(0);
  }

  const generatorRecent = generatorRecords.slice(0, 3);
  const rentalOfficeRecent = rentalOfficeRecords.slice(0, 3);
  const shopRecent = shopRecords.slice(0, 3);
  const poolDateKeys = Object.keys(poolEntries).sort().reverse().slice(0, 3);

    for (const prop in e) out[prop] = e[prop];

    else if (key === "pool") navigate("poolHome");
